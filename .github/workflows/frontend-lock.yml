name: Generate frontend lockfile

on:
  push:
    branches: [feat/v0.1-frontend-coverage]
    paths:
      - ui/package.json
      - .github/workflows/frontend-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'

      - name: Generate npm lockfile
        working-directory: ui
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile
        run: |
          git add ui/package-lock.json
          if git diff --cached --quiet; then
            echo 'lockfile already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ui): lock frontend dependencies'
          git push origin "HEAD:${GITHUB_REF_NAME}"

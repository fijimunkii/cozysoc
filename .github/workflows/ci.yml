name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-network:
    name: Native macOS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    env:
      # Canonical and short: Darwin UDS paths are bounded, and /tmp is a symlink.
      TMPDIR: /private/tmp
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false

      - name: Install test-only TCP peer dependency
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install libslirp pkgconf
          test "$(pkg-config --modversion slirp)" = 4.9.4

      - name: Run native Go and lab-harness regression checks
        run: |
          test "$(id -u)" -ne 0
          sw_vers
          uname -m
          test -z "$(gofmt -l cmd internal tests)"
          go vet ./...
          go test -count=1 ./...
          go test -race -count=1 ./internal/controller/httpsrun ./internal/controller/httpstcp ./internal/controller/httpsexchange ./internal/controller/checkroute ./internal/controller/httpsroute ./internal/controller/resolverroute ./internal/controller/gatewayroute ./internal/controller/gatewayicmp ./internal/controller/gatewayrun ./internal/controller/localapi
          python3 scripts/test-check-macos-lab.py
          python3 scripts/test-macos-lab-runner.py
          python3 scripts/test-macos-lab-trust.py

      - name: Run real isolated networking in normal-user Terminal context
        env:
          COZYSOC_MACOS_LAB: '1'
        run: bash scripts/test-macos-network.sh

  repository:
    name: Repository checks
    needs: macos-network
    # Keep the established aggregate check red when a dependency fails or skips.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require all native macOS matrix jobs
        env:
          NATIVE_RESULT: ${{ needs.macos-network.result }}
        run: test "$NATIVE_RESULT" = success

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run repository checks
        run: |
          bash scripts/check-repo.sh
          python3 scripts/test-check-macos-lab.py
          python3 scripts/test-macos-lab-runner.py
          python3 scripts/test-macos-lab-trust.py

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false

      - name: Run controller checks
        run: |
          test -z "$(gofmt -l cmd internal tests)"
          go vet ./...
          go test ./...

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Run frontend checks
        working-directory: ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check

      - name: Run process E2E smoke
        run: |
          go build -o "${RUNNER_TEMP}/cozysoc-e2e" ./cmd/cozysoc
          COZYSOC_E2E_BINARY="${RUNNER_TEMP}/cozysoc-e2e" \
          COZYSOC_E2E_UI_DIR="${GITHUB_WORKSPACE}/ui/dist" \
            go test -v -count=1 ./tests/e2e

      - name: Verify macOS controller build
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          go build ./cmd/cozysoc
          go test -c ./internal/controller/localapi -o "${RUNNER_TEMP}/localapi-darwin.test"
          go test -c ./internal/controller/secretstore -o "${RUNNER_TEMP}/secretstore-darwin.test"
          go test -c ./internal/controller/devicewatch -o "${RUNNER_TEMP}/devicewatch-darwin.test"
          go test -c ./internal/controller/gatewayroute -o "${RUNNER_TEMP}/gatewayroute-darwin.test"
          go test -c ./internal/controller/gatewayicmp -o "${RUNNER_TEMP}/gatewayicmp-darwin.test"

      - name: Run Foundation feasibility checks
        working-directory: experiments/foundation/feasibility
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Validate pull request title and commit subjects
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/check-conventional.sh "$PR_TITLE"

          mapfile -t subjects < <(git log --format=%s "${BASE_SHA}..${HEAD_SHA}")
          if (( ${#subjects[@]} == 0 )); then
            echo 'no pull request commits found to validate' >&2
            exit 1
          fi

          bash scripts/check-conventional.sh "${subjects[@]}"
